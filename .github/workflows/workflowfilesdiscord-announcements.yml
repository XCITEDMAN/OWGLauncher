# Copies the latest posts from the OWG Discord announcements channel into
# announcements.json, which the OWG Launcher shows in its Announcements panel.
name: Discord announcements

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:        # "Run workflow" button for an instant update

permissions:
  contents: write

concurrency:
  group: discord-announcements
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # always start from the newest copy (also makes "Re-run" safe)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read Discord channel
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          MAX_MESSAGES: ${{ vars.DISCORD_MAX_MESSAGES || '10' }}
        run: node scripts/discord-announcements.mjs
      - name: Save changes
        run: |
          if git diff --quiet -- announcements.json && git ls-files --error-unmatch announcements.json >/dev/null 2>&1; then
            echo "No new announcements."
            exit 0
          fi
          git config user.name "owg-announcements-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add announcements.json
          git commit -m "Update announcements from Discord"
          git push
